<body>

<!-- Sign in -->
<main class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <img src="assets/img/logo.webp" alt="Ravari" width="199" height="24">
    <h1 class="h1">Admin panel</h1>
    <p class="muted" id="loginNote">Sign in to manage your store.</p>
    <label class="field"><span>Email</span><input class="input" name="email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn btn--dark" type="submit">Sign in</button>
    <div class="flex flex--between"><a class="muted small" href="./">← Back to the store</a><a class="small" href="#" id="forgotLink">Forgot password?</a></div>
  </form>
  <form class="login__card" id="forgotForm" hidden>
    <img src="assets/img/logo.webp" alt="Ravari" width="199" height="24">
    <h1 class="h1">Forgot password</h1>
    <p class="muted" id="forgotNote">Enter the email you sign in with. We'll email you a link to choose a new password.</p>
    <label class="field"><span>Email</span><input class="input" name="email" type="email" autocomplete="username" required></label>
    <p class="err" id="forgotErr" hidden></p>
    <button class="btn btn--dark" type="submit">Send reset link</button>
    <a class="small" href="#" data-back-login>← Back to sign in</a>
  </form>
  <form class="login__card" id="resetForm" hidden>
    <img src="assets/img/logo.webp" alt="Ravari" width="199" height="24">
    <h1 class="h1">New password</h1>
    <p class="muted" id="resetNote">Checking your link…</p>
    <label class="field"><span>New password</span><input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="field"><span>Type it again</span><input class="input" name="password2" type="password" autocomplete="new-password" minlength="8" required></label>
    <p class="err" id="resetErr" hidden></p>
    <button class="btn btn--dark" type="submit">Save new password</button>
    <a class="small" href="#" data-back-login>← Back to sign in</a>
  </form>
</main>

<!-- App -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="side__brand" href="#/dashboard"><img src="assets/img/logo-light.webp" alt="Ravari" width="149" height="18"></a>
    <nav class="side__nav" id="sideNav" aria-label="Admin"></nav>
    <div class="side__foot">
      <a class="side__store" href="./" target="_blank" rel="noopener">View store ↗</a>
      <a class="side__user" href="#/account" id="sideUser"></a>
      <button class="btn btn--ghost btn--sm" type="button" id="logout">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon top__menu" type="button" id="menuBtn" aria-label="Menu">☰</button>
      <p class="top__title" id="topTitle"></p>
      <span class="badge badge--demo" id="demoBadge" hidden>Demo data in this browser · <button type="button" id="resetDemo">Reset</button></span>
    </header>
    <section class="view" id="view" tabindex="-1"></section>
  </div>
</div>
<div class="side-scrim" id="sideScrim" hidden></div>

<div class="modal-wrap" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head"><h2 class="h2" id="modalTitle"></h2><button class="icon" type="button" data-modal-close aria-label="Close">✕</button></header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/client.js?v=1375"></script>
<script src="assets/admin/admin.js?v=1375"></script>
</body>
</html>
